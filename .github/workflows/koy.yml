name: Koi
on:
  schedule:
    - cron: "0 0 * * *" # Se ejecuta a medianoche UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yalongwastaken/git-koi@v1.0.2
      - name: Guardar el koi generado
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualizar koi de GitHub"
